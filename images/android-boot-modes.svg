<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">Android service modes overview</title><desc id="desc">Comparison of Android running with ADB, recovery mode and bootloader fastboot mode.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111827"/><stop offset="1" stop-color="#203247"/></linearGradient></defs>
<rect width="1200" height="620" rx="28" fill="url(#bg)"/>
<text x="60" y="76" fill="#fff" font-family="Arial,sans-serif" font-size="36" font-weight="700">ANDROID SERVICE MODES</text>
<text x="60" y="112" fill="#a9c2d2" font-family="Arial,sans-serif" font-size="20">Three different environments — do not confuse their commands</text>
<g>
<rect x="60" y="165" width="335" height="340" rx="22" fill="#1d3b4b" stroke="#38bdf8" stroke-width="2"/>
<circle cx="227" cy="240" r="47" fill="#0e2536" stroke="#38bdf8" stroke-width="3"/>
<path d="M205 226h44v28h-44zM213 218h28M213 262h28" stroke="#8edcff" stroke-width="4" fill="none" stroke-linecap="round"/>
<text x="227" y="326" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="25" font-weight="700">ANDROID + ADB</text>
<text x="227" y="365" text-anchor="middle" fill="#b9d6e5" font-family="Arial,sans-serif" font-size="18">Android is running</text>
<text x="227" y="410" text-anchor="middle" fill="#8edcff" font-family="monospace" font-size="19">adb devices</text>
<text x="227" y="443" text-anchor="middle" fill="#8edcff" font-family="monospace" font-size="19">adb shell getprop</text>
<text x="227" y="478" text-anchor="middle" fill="#b9d6e5" font-family="Arial,sans-serif" font-size="15">Inspect / manage authorized device</text>
<rect x="432" y="165" width="335" height="340" rx="22" fill="#3b3020" stroke="#f59e0b" stroke-width="2"/>
<circle cx="599" cy="240" r="47" fill="#2c2115" stroke="#f59e0b" stroke-width="3"/>
<path d="M575 246l24-30 24 30M599 216v48" stroke="#ffd18a" stroke-width="4" fill="none" stroke-linecap="round"/>
<text x="599" y="326" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="25" font-weight="700">RECOVERY</text>
<text x="599" y="365" text-anchor="middle" fill="#e7d5b8" font-family="Arial,sans-serif" font-size="18">Separate maintenance environment</text>
<text x="599" y="410" text-anchor="middle" fill="#ffd18a" font-family="monospace" font-size="19">adb reboot recovery</text>
<text x="599" y="443" text-anchor="middle" fill="#e7d5b8" font-family="Arial,sans-serif" font-size="16">Reset / update options vary</text>
<text x="599" y="478" text-anchor="middle" fill="#e7d5b8" font-family="Arial,sans-serif" font-size="15">Wipe is destructive — confirm first</text>
<rect x="804" y="165" width="335" height="340" rx="22" fill="#26334c" stroke="#a78bfa" stroke-width="2"/>
<circle cx="971" cy="240" r="47" fill="#1a2540" stroke="#a78bfa" stroke-width="3"/>
<path d="M949 220h44v40h-44zM956 232h30M956 243h30M956 254h20" stroke="#d2c5ff" stroke-width="3" fill="none"/>
<text x="971" y="326" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="25" font-weight="700">BOOTLOADER</text>
<text x="971" y="365" text-anchor="middle" fill="#d4c8f4" font-family="Arial,sans-serif" font-size="18">Fastboot on supported devices</text>
<text x="971" y="410" text-anchor="middle" fill="#d2c5ff" font-family="monospace" font-size="19">fastboot devices</text>
<text x="971" y="443" text-anchor="middle" fill="#d4c8f4" font-family="monospace" font-size="19">fastboot getvar product</text>
<text x="971" y="478" text-anchor="middle" fill="#d4c8f4" font-family="Arial,sans-serif" font-size="15">Not universal across manufacturers</text>
</g>
<text x="600" y="563" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="20" font-weight="700">A command valid in one mode may not work in another.</text>
<text x="600" y="594" text-anchor="middle" fill="#9eb3c3" font-family="Arial,sans-serif" font-size="16">Only perform destructive operations after model, firmware and backup checks.</text>
</svg>