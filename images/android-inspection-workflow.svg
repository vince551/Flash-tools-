<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
<title id="title">Android device inspection workflow</title><desc id="desc">Connect phone, authorize ADB, inspect read-only properties, and save a private diagnostic report.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101827"/><stop offset="1" stop-color="#172b3a"/></linearGradient><linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#22c55e"/><stop offset="1" stop-color="#38bdf8"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000" flood-opacity=".25"/></filter></defs>
<rect width="1200" height="560" rx="28" fill="url(#bg)"/>
<text x="64" y="76" fill="#fff" font-family="Arial,sans-serif" font-size="34" font-weight="700">FLASH TOOLS · ANDROID INSPECTION</text>
<text x="64" y="112" fill="#a9c2d2" font-family="Arial,sans-serif" font-size="20">A safe, read-only workflow using ADB on Windows</text>
<g filter="url(#shadow)">
<rect x="58" y="190" width="235" height="220" rx="20" fill="#203548" stroke="#3d6176"/>
<rect x="143" y="222" width="66" height="116" rx="12" fill="#0c1724" stroke="#8bd4f4" stroke-width="3"/>
<rect x="151" y="234" width="50" height="88" rx="5" fill="#153e4b"/>
<circle cx="176" cy="330" r="3" fill="#8bd4f4"/>
<text x="176" y="370" fill="#fff" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" font-weight="700">1. CONNECT</text>
<text x="176" y="394" fill="#b9cbd6" text-anchor="middle" font-family="Arial,sans-serif" font-size="15">USB data cable</text>
<rect x="345" y="190" width="235" height="220" rx="20" fill="#203548" stroke="#3d6176"/>
<rect x="380" y="226" width="165" height="93" rx="10" fill="#0b1420" stroke="#55b9e7"/>
<text x="462" y="263" fill="#55e6a5" text-anchor="middle" font-family="monospace" font-size="19">adb devices</text>
<text x="462" y="291" fill="#c5d9e5" text-anchor="middle" font-family="monospace" font-size="14">device</text>
<text x="462" y="370" fill="#fff" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" font-weight="700">2. AUTHORIZE</text>
<text x="462" y="394" fill="#b9cbd6" text-anchor="middle" font-family="Arial,sans-serif" font-size="15">Approve trusted PC</text>
<rect x="632" y="190" width="235" height="220" rx="20" fill="#203548" stroke="#3d6176"/>
<rect x="666" y="225" width="168" height="96" rx="10" fill="#0b1420" stroke="#22c55e"/>
<text x="750" y="253" fill="#8ce8b6" text-anchor="middle" font-family="monospace" font-size="15">getprop model</text>
<text x="750" y="278" fill="#8ce8b6" text-anchor="middle" font-family="monospace" font-size="15">getprop version</text>
<text x="750" y="303" fill="#8ce8b6" text-anchor="middle" font-family="monospace" font-size="15">getprop platform</text>
<text x="750" y="370" fill="#fff" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" font-weight="700">3. INSPECT</text>
<text x="750" y="394" fill="#b9cbd6" text-anchor="middle" font-family="Arial,sans-serif" font-size="15">Read-only properties</text>
<rect x="919" y="190" width="235" height="220" rx="20" fill="#203548" stroke="#3d6176"/>
<path d="M1001 225h75l22 22v78h-97z" fill="#102334" stroke="#65c9e8" stroke-width="3"/>
<path d="M1076 225v24h22" fill="none" stroke="#65c9e8" stroke-width="3"/>
<path d="M1018 268h60M1018 286h60M1018 304h42" stroke="#80e2ad" stroke-width="5" stroke-linecap="round"/>
<text x="1036" y="370" fill="#fff" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" font-weight="700">4. SAVE</text>
<text x="1036" y="394" fill="#b9cbd6" text-anchor="middle" font-family="Arial,sans-serif" font-size="15">Private TXT / JSON</text>
</g>
<g stroke="url(#accent)" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M298 300h38m-12 -12 12 12-12 12"/><path d="M585 300h38m-12 -12 12 12-12 12"/><path d="M872 300h38m-12 -12 12 12-12 12"/></g>
<rect x="58" y="455" width="1096" height="58" rx="14" fill="#153b32" stroke="#2f9d70"/>
<text x="606" y="491" fill="#b8f5d4" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="700">READ ONLY · NO RESET · NO UNLOCK · NO FLASH</text>
</svg>