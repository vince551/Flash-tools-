<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">Android firmware identification flow</title>
<desc id="desc">Collect exact model, codename and build information, identify chipset and region, verify official package metadata and checksum, then decide whether it is a verified candidate or stop.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071b25"/><stop offset="1" stop-color="#153847"/></linearGradient>
<linearGradient id="a" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#40d6bd"/><stop offset="1" stop-color="#65a8ff"/></linearGradient>
<style>
.h{font:700 34px Arial;fill:#f5fbff}.sub{font:18px Arial;fill:#bad1dc}.box{fill:#153a49;stroke:#4a8190;stroke-width:2}.t{font:700 20px Arial;fill:#f5fbff}.s{font:16px Arial;fill:#c8dce4}.n{font:700 19px Arial;fill:#071b25}.warn{font:700 18px Arial;fill:#ffd27d}
</style></defs>
<rect width="1200" height="700" rx="28" fill="url(#bg)"/>
<text x="58" y="72" class="h">FIRMWARE IDENTIFICATION — BEFORE YOU FLASH</text>
<text x="58" y="108" class="sub">A compatibility decision is based on the complete device identity, not its marketing name.</text>
<g transform="translate(55 160)">
<rect class="box" width="320" height="150" rx="20"/><circle cx="34" cy="34" r="19" fill="url(#a)"/><text x="34" y="41" class="n" text-anchor="middle">1</text>
<text x="28" y="82" class="t">Identify exact device</text><text x="28" y="113" class="s">Model • codename • SKU</text><text x="28" y="138" class="s">Region • hardware revision</text></g>
<path d="M380 235 H420" stroke="#6ad0c4" stroke-width="4"/><path d="M410 225 L422 235 L410 245" stroke="#6ad0c4" stroke-width="4" fill="none"/>
<g transform="translate(435 160)">
<rect class="box" width="320" height="150" rx="20"/><circle cx="34" cy="34" r="19" fill="url(#a)"/><text x="34" y="41" class="n" text-anchor="middle">2</text>
<text x="28" y="82" class="t">Record software build</text><text x="28" y="113" class="s">Android • build ID • fingerprint</text><text x="28" y="138" class="s">Security patch • board platform</text></g>
<path d="M760 235 H800" stroke="#6ad0c4" stroke-width="4"/><path d="M790 225 L802 235 L790 245" stroke="#6ad0c4" stroke-width="4" fill="none"/>
<g transform="translate(815 160)">
<rect class="box" width="330" height="150" rx="20"/><circle cx="34" cy="34" r="19" fill="url(#a)"/><text x="34" y="41" class="n" text-anchor="middle">3</text>
<text x="28" y="82" class="t">Classify service family</text><text x="28" y="113" class="s">MTK • Unisoc • Qualcomm</text><text x="28" y="138" class="s">Samsung / other OEM path</text></g>
<path d="M980 315 V365 H600 V390" stroke="#6ad0c4" stroke-width="4" fill="none"/><path d="M590 380 L600 392 L610 380" stroke="#6ad0c4" stroke-width="4" fill="none"/>
<g transform="translate(365 400)">
<rect class="box" width="470" height="130" rx="20"/><circle cx="38" cy="36" r="19" fill="url(#a)"/><text x="38" y="43" class="n" text-anchor="middle">4</text>
<text x="32" y="82" class="t">Verify official firmware package</text><text x="32" y="111" class="s">Exact target • metadata • signature / checksum</text></g>
<path d="M600 535 V565" stroke="#6ad0c4" stroke-width="4"/><path d="M590 555 L600 567 L610 555" stroke="#6ad0c4" stroke-width="4" fill="none"/>
<g transform="translate(120 580)">
<rect width="430" height="75" rx="16" fill="#174b3c" stroke="#4cba8e" stroke-width="2"/><text x="24" y="32" class="t">MATCH: candidate only</text><text x="24" y="58" class="s">Still needs backup, consent and model procedure.</text></g>
<g transform="translate(650 580)">
<rect width="430" height="75" rx="16" fill="#4b3025" stroke="#d18b50" stroke-width="2"/><text x="24" y="32" class="warn">MISMATCH / UNKNOWN: STOP</text><text x="24" y="58" class="s">Do not flash. Gather evidence or seek OEM support.</text></g>
</svg>