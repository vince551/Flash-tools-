<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">MediaTek firmware identification and preparation</title>
<desc id="desc">Verify exact phone identity, inspect platform properties, examine the target-specific scatter package, verify package source and integrity, then stop or mark it as a candidate for an authorized procedure.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071b25"/><stop offset="1" stop-color="#173847"/></linearGradient>
<linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#38d6bd"/><stop offset="1" stop-color="#68a9ff"/></linearGradient>
<style>
.h{font:700 34px Arial;fill:#f5fbff}.sub{font:18px Arial;fill:#bad1dc}.box{fill:#153a49;stroke:#4a8190;stroke-width:2}.t{font:700 20px Arial;fill:#f5fbff}.s{font:16px Arial;fill:#c8dce4}.num{font:700 19px Arial;fill:#071b25}.warn{font:700 18px Arial;fill:#ffd27d}
</style></defs>
<rect width="1200" height="700" rx="28" fill="url(#bg)"/>
<text x="58" y="72" class="h">MEDIATEK — IDENTIFY BEFORE SERVICE</text>
<text x="58" y="108" class="sub">A scatter package is target-specific. The chipset name alone does not prove compatibility.</text>
<g transform="translate(55 165)">
<rect class="box" width="320" height="150" rx="20"/><circle cx="35" cy="35" r="19" fill="url(#accent)"/><text x="35" y="42" class="num" text-anchor="middle">1</text>
<text x="28" y="82" class="t">Verify phone identity</text><text x="28" y="113" class="s">Exact model • codename</text><text x="28" y="138" class="s">Board • region • hardware</text></g>
<path d="M380 240 H420" stroke="#6ad0c4" stroke-width="4"/><path d="M410 230 L422 240 L410 250" stroke="#6ad0c4" stroke-width="4" fill="none"/>
<g transform="translate(435 165)">
<rect class="box" width="320" height="150" rx="20"/><circle cx="35" cy="35" r="19" fill="url(#accent)"/><text x="35" y="42" class="num" text-anchor="middle">2</text>
<text x="28" y="82" class="t">Inspect build properties</text><text x="28" y="113" class="s">Build fingerprint • platform</text><text x="28" y="138" class="s">Android version • ABI</text></g>
<path d="M760 240 H800" stroke="#6ad0c4" stroke-width="4"/><path d="M790 230 L802 240 L790 250" stroke="#6ad0c4" stroke-width="4" fill="none"/>
<g transform="translate(815 165)">
<rect class="box" width="330" height="150" rx="20"/><circle cx="35" cy="35" r="19" fill="url(#accent)"/><text x="35" y="42" class="num" text-anchor="middle">3</text>
<text x="28" y="82" class="t">Inspect scatter package</text><text x="28" y="113" class="s">Target • partition map</text><text x="28" y="138" class="s">Image names • manifest</text></g>
<path d="M980 320 V365 H600 V390" stroke="#6ad0c4" stroke-width="4" fill="none"/><path d="M590 380 L600 392 L610 380" stroke="#6ad0c4" stroke-width="4" fill="none"/>
<g transform="translate(365 400)">
<rect class="box" width="470" height="130" rx="20"/><circle cx="38" cy="36" r="19" fill="url(#accent)"/><text x="38" y="43" class="num" text-anchor="middle">4</text>
<text x="32" y="82" class="t">Verify source and integrity</text><text x="32" y="111" class="s">Official source • checksum • authorized procedure</text></g>
<path d="M600 535 V565" stroke="#6ad0c4" stroke-width="4"/><path d="M590 555 L600 567 L610 555" stroke="#6ad0c4" stroke-width="4" fill="none"/>
<g transform="translate(120 580)">
<rect width="430" height="75" rx="16" fill="#174b3c" stroke="#4cba8e" stroke-width="2"/><text x="24" y="32" class="t">MATCH: candidate only</text><text x="24" y="58" class="s">Requires backup, consent and OEM method.</text></g>
<g transform="translate(650 580)">
<rect width="430" height="75" rx="16" fill="#4b3025" stroke="#d18b50" stroke-width="2"/><text x="24" y="32" class="warn">MISMATCH / UNKNOWN: STOP</text><text x="24" y="58" class="s">Never test a similar model's scatter or preloader.</text></g>
</svg>